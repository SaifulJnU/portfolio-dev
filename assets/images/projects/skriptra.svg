<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" fill="none" aria-hidden="true">
  <!-- Skriptra: chapters down the side, every question of the selected chapter
       listed by year, with frequency analytics floating over the list. -->
  <defs>
    <radialGradient id="sk-amb-a" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sk-amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sk-chrome" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#12251f" stop-opacity=".92"/>
      <stop offset="100%" stop-color="#161712" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="sk-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <filter id="sk-lift" x="-25%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="16" stdDeviation="16" flood-color="#040705" flood-opacity=".5"/>
    </filter>
    <filter id="sk-lift-sm" x="-40%" y="-40%" width="190%" height="190%">
      <feDropShadow dx="-3" dy="10" stdDeviation="10" flood-color="#040705" flood-opacity=".55"/>
    </filter>
  </defs>

  <ellipse cx="520" cy="40" rx="240" ry="170" fill="url(#sk-amb-a)"/>
  <ellipse cx="180" cy="400" rx="230" ry="160" fill="url(#sk-amb-b)"/>

  <g filter="url(#sk-lift)">
    <rect x="150" y="28" width="530" height="374" rx="16" fill="url(#sk-chrome)" stroke="#2dd4bf" stroke-opacity=".28" stroke-width="1.5"/>
  </g>

  <g>
    <path d="M150 68h530" stroke="#f4f1ec" stroke-opacity=".12" stroke-width="1.5"/>
    <g fill="#f4f1ec" fill-opacity=".3">

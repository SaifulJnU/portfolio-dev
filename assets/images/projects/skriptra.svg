      <rect x="318" y="254" width="40" height="16" rx="8" fill="#2dd4bf" fill-opacity=".18" stroke="#2dd4bf" stroke-opacity=".5"/>
      <rect x="372" y="258" width="150" height="8" rx="4" fill="#f4f1ec" fill-opacity=".3"/>
